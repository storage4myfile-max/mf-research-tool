<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORS Proxy Test</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
  button { width: 100%; padding: 14px; font-size: 16px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; background: #f5f5f5; }
  button:active { background: #e0e0e0; }
  #log { font-family: monospace; font-size: 12px; white-space: pre-wrap; margin-top: 1rem; color: #555; }
  .ok { background: #d4edda; padding: 12px; border-radius: 8px; margin-top: 1rem; }
  .fail { background: #f8d7da; padding: 12px; border-radius: 8px; margin-top: 1rem; }
  table { width: 100%; font-size: 13px; margin-top: 8px; }
  td { padding: 4px 6px; }
</style>
</head>
<body>

<h2>CORS Proxy Test</h2>
<p>Fetches quant Multi Asset Allocation Fund holdings (AMFI 101071) from this page's real domain — <code id="origin"></code>.</p>

<button id="run">Test holdings fetch</button>
<div id="log"></div>
<div id="result"></div>

<script>
document.getElementById('origin').textContent = window.location.origin;

const POCKETEDGE_BASE = 'https://openfin.pocketedge.in/api/v1';
const PROXY_CHAIN = [
  { name: 'AllOrigins',   build: (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
  { name: 'corsproxy.io', build: (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}` },
  { name: 'thingproxy',   build: (url) => `https://thingproxy.freeboard.io/fetch/${url}` },
  { name: 'direct (no proxy)', build: (url) => url },
];

function log(msg) {
  document.getElementById('log').textContent += msg + '\n';
}

async function fetchViaProxyChain(targetUrl) {
  let lastError;
  for (const proxy of PROXY_CHAIN) {
    log('Trying ' + proxy.name + '...');
    try {
      const res = await fetch(proxy.build(targetUrl));
      if (res.ok) {
        log(proxy.name + ' SUCCEEDED (HTTP ' + res.status + ')');
        return { res, proxyUsed: proxy.name };
      }
      log(proxy.name + ' returned HTTP ' + res.status);
      lastError = new Error('Proxy returned ' + res.status);
    } catch (err) {
      log(proxy.name + ' FAILED: ' + err.message);
      lastError = err;
    }
  }
  throw lastError || new Error('All proxies failed');
}

document.getElementById('run').addEventListener('click', async function () {
  const btn = document.getElementById('run');
  const out = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = 'Testing...';
  out.innerHTML = '';
  document.getElementById('log').textContent = '';

  try {
    const targetUrl = POCKETEDGE_BASE + '/holdings/101071';
    const { res, proxyUsed } = await fetchViaProxyChain(targetUrl);
    const data = await res.json();
    const holdings = data.holdings || [];
    const top5 = [...holdings]
      .filter(h => h.pct_to_nav != null)
      .sort((a, b) => Number(b.pct_to_nav) - Number(a.pct_to_nav))
      .slice(0, 5);

    const rows = top5.map(h =>
      `<tr><td>${h.instrument}</td><td style="text-align:right;">${Number(h.pct_to_nav).toFixed(2)}%</td></tr>`
    ).join('');

    out.innerHTML = `<div class="ok">
      <strong>Worked via ${proxyUsed}</strong><br>
      ${holdings.length} holdings fetched. As of ${data.as_of || data.latest_as_of || '?'}.
      <table><tbody>${rows}</tbody></table>
    </div>`;
  } catch (err) {
    out.innerHTML = `<div class="fail">
      <strong>All proxies failed</strong><br>
      ${err && err.message ? err.message : 'Request failed'}
    </div>`;
  }
  btn.disabled = false;
  btn.textContent = 'Test again';
});
</script>

</body>
</html>
